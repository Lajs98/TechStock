<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>TechStock - Equipamentos</title>
</h:head>

<h:body>

    <p:growl id="mensagens"
             showDetail="true"
             life="3000" />

    <p:panel header="Cadastro de Equipamentos">

        <h:form id="formEquipamento">

            <p:panelGrid columns="2">

                <p:outputLabel value="Patrimônio:" />
                <p:inputText value="#{equipamentoController.equipamento.patrimonio}" />

                <p:outputLabel value="Tipo:" />
                <p:selectOneMenu value="#{equipamentoController.equipamento.tipo}">
                    <f:selectItem itemLabel="Selecione" itemValue="#{null}" />
                    <f:selectItems value="#{equipamentoController.tiposEquipamento}" />
                </p:selectOneMenu>

                <p:outputLabel value="Marca:" />
                <p:inputText value="#{equipamentoController.equipamento.marca}" />

                <p:outputLabel value="Modelo:" />
                <p:inputText value="#{equipamentoController.equipamento.modelo}" />

                <p:outputLabel value="Serial:" />
                <p:inputText value="#{equipamentoController.equipamento.serial}" />

            </p:panelGrid>

            <br/>

            <p:commandButton
                    value="Salvar"
                    action="#{equipamentoController.salvar}"
                    icon="pi pi-save"
                    ajax="false" />

            <p:button
                    value="Voltar"
                    outcome="index"
                    icon="pi pi-arrow-left" />

        </h:form>

        <p:separator />

        <h2>Equipamentos cadastrados</h2>

        <h:form id="formTabela">

            <p:panel header="Filtros">

                <p:panelGrid columns="4">

                    <p:outputLabel value="Buscar:" />
                    <p:inputText value="#{equipamentoController.termoBusca}"
                                 placeholder="Patrimônio, marca, modelo ou serial" />

                    <p:outputLabel value="Status:" />
                    <p:selectOneMenu value="#{equipamentoController.statusFiltro}">
                        <f:selectItem itemLabel="Todos" itemValue="#{null}" />
                        <f:selectItems value="#{equipamentoController.statusEquipamento}" />
                    </p:selectOneMenu>

                </p:panelGrid>

                <br/>

                <p:commandButton
                        value="Filtrar"
                        icon="pi pi-filter"
                        update="tabelaEquipamentos" />

                <p:commandButton
                        value="Limpar"
                        action="#{equipamentoController.limparFiltros}"
                        icon="pi pi-refresh"
                        update="formTabela"
                        process="@this" />

            </p:panel>

            <br/>

            <p:dataTable id="tabelaEquipamentos"
                         value="#{equipamentoController.equipamentos}"
                         var="equip"
                         emptyMessage="Nenhum equipamento encontrado.">

                <p:column headerText="Patrimônio">
                    <h:outputText value="#{equip.patrimonio}" />
                </p:column>

                <p:column headerText="Tipo">
                    <h:outputText value="#{equip.tipo}" />
                </p:column>

                <p:column headerText="Marca">
                    <h:outputText value="#{equip.marca}" />
                </p:column>

                <p:column headerText="Modelo">
                    <h:outputText value="#{equip.modelo}" />
                </p:column>

                <p:column headerText="Serial">
                    <h:outputText value="#{equip.serial}" />
                </p:column>

                <p:column headerText="Status">
                    <h:outputText value="#{equip.status}" />
                </p:column>

                <p:column headerText="Cadastrado Por">
                    <h:outputText value="#{equip.usuarioCadastro.nome}" />
                </p:column>

                <p:column headerText="Data Cadastro">
                    <h:outputText value="#{equip.dataCadastroFormatada}" />
                </p:column>

                <p:column headerText="Última Alteração">
                    <h:outputText value="#{equip.dataUltimaAlteracaoFormatada}" />
                </p:column>

                <p:column headerText="Alterado Por">
                    <h:outputText value="#{equip.usuarioUltimaAlteracao.nome}" />
                </p:column>

                <p:column headerText="Ações">

                    <p:commandButton
                            value="Editar"
                            action="#{equipamentoController.editar(equip)}"
                            icon="pi pi-pencil"
                            ajax="false" />

                    <p:commandButton
                            value="Descartar"
                            action="#{equipamentoController.descartar(equip.id)}"
                            icon="pi pi-times-circle"
                            ajax="false" />

                </p:column>

            </p:dataTable>

        </h:form>

    </p:panel>

</h:body>
</html>
